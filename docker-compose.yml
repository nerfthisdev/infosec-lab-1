services:
  postgres:
    image: postgres:17-alpine
    container_name: infosec-lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: infosec
      POSTGRES_USER: infosec
      POSTGRES_PASSWORD: infosec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infosec -d infosec"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
